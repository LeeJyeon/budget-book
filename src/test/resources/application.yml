spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:budget-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:h2:mem:budget-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    user: sa
    password:
  thymeleaf:
    cache: false
  test:
    database:
      replace: none

app:
  timezone: Asia/Seoul
  whitelist:
    - test@example.com
  dev-auth:
    enabled: true
    email: test@example.com
    display-name: Test User
    role: HUSBAND
