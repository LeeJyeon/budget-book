<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>정기 지출/수입 정리 - budget-book</title></head>
<body>
<div layout:fragment="content">
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-bold">정기 지출/수입 정리</h1>
        <a th:href="@{/recurring/new}"
           class="bg-blue-600 hover:bg-blue-700 text-white text-sm rounded px-4 py-2">+ 항목 추가</a>
    </div>

    <p class="text-xs text-gray-500 mb-4">
        매월 반복되는 고정 지출/수입을 메모로 모아두는 페이지예요. 자동으로 거래가 등록되지는 않아요.
        실제 결제가 발생하면 <span class="font-semibold">기록하기</span> 버튼을 눌러 거래를 직접 등록해주세요.
    </p>

    <section class="bg-white border rounded">
        <div class="hidden sm:grid grid-cols-12 gap-2 px-4 py-2 border-b bg-gray-50 text-xs font-semibold text-gray-600">
            <div class="col-span-3">이름</div>
            <div class="col-span-1">섹션</div>
            <div class="col-span-1">종류</div>
            <div class="col-span-2 text-right">예상 금액</div>
            <div class="col-span-1">매월</div>
            <div class="col-span-1">상태</div>
            <div class="col-span-2">태그</div>
            <div class="col-span-1 text-right">동작</div>
        </div>

        <div th:if="${#lists.isEmpty(items)}" class="p-6 text-center text-sm text-gray-500">
            아직 등록된 정기 항목이 없어요.
        </div>

        <ul th:unless="${#lists.isEmpty(items)}" class="divide-y">
            <li th:each="item : ${items}"
                class="px-4 py-3 grid grid-cols-1 sm:grid-cols-12 gap-2 sm:items-center"
                th:classappend="${item.active} ? '' : 'opacity-60'">
                <div class="sm:col-span-3 font-semibold">
                    <a th:href="@{/recurring/{id}(id=${item.id})}"
                       class="hover:underline"
                       th:text="${item.name}">이름</a>
                    <p th:if="${item.memo}" class="text-xs text-gray-500 mt-0.5" th:text="${item.memo}">메모</p>
                </div>
                <div class="sm:col-span-1">
                    <span class="inline-block text-xs rounded px-2 py-0.5 bg-gray-100"
                          th:text="${item.section.label}">공용</span>
                </div>
                <div class="sm:col-span-1">
                    <span class="inline-block text-xs rounded px-2 py-0.5"
                          th:classappend="${item.type.name() == 'INCOME'} ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
                          th:text="${item.type.label}">지출</span>
                </div>
                <div class="sm:col-span-2 text-right tabular-nums"
                     th:text="${#numbers.formatInteger(item.amount, 3, 'COMMA') + '원'}">9,500원
                </div>
                <div class="sm:col-span-1 text-sm"
                     th:text="${item.dayOfMonth != null} ? ('매월 ' + ${item.dayOfMonth} + '일') : '—'">매월 13일
                </div>
                <div class="sm:col-span-1">
                    <form th:action="@{/recurring/{id}/toggle(id=${item.id})}" method="post" class="inline">
                        <button type="submit"
                                th:text="${item.active} ? '활성' : '비활성'"
                                th:classappend="${item.active} ? 'bg-blue-50 text-blue-700' : 'bg-gray-100 text-gray-500'"
                                class="text-xs rounded px-2 py-0.5 hover:opacity-80">활성
                        </button>
                    </form>
                </div>
                <div class="sm:col-span-2 flex flex-wrap gap-1">
                    <span th:each="tag : ${item.tags}"
                          class="text-xs rounded-full px-2 py-0.5 border"
                          th:style="'background-color:' + ${tag.color} + '20; border-color:' + ${tag.color}"
                          th:text="${tag.name}">태그</span>
                </div>
                <div class="sm:col-span-1 flex justify-end gap-2">
                    <a th:if="${item.active}"
                       th:href="@{/recurring/{id}/log(id=${item.id})}"
                       class="bg-green-600 hover:bg-green-700 text-white text-xs rounded px-3 py-1.5">기록하기</a>
                    <form th:action="@{/recurring/{id}/delete(id=${item.id})}" method="post"
                          class="inline"
                          onsubmit="return confirm('삭제할까요?')">
                        <button type="submit"
                                class="text-xs text-red-600 hover:underline">삭제
                        </button>
                    </form>
                </div>
            </li>
        </ul>
    </section>
</div>
</body>
</html>
