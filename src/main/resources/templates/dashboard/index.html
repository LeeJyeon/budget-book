<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>대시보드 - budget-book</title></head>
<body>
<div layout:fragment="content">
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-bold"
            th:text="${currentUser != null ? '안녕하세요, ' + currentUser.displayName + '님' : '안녕하세요'}">
            안녕하세요
        </h1>
        <div class="flex gap-2">
            <a href="/transactions/new"
               class="bg-blue-600 hover:bg-blue-700 text-white text-sm rounded px-3 py-2">+ 거래 등록</a>
            <a href="/recurring"
               class="bg-gray-100 hover:bg-gray-200 text-sm rounded px-3 py-2">정기 지출 보기</a>
        </div>
    </div>

    <section class="grid gap-3 sm:grid-cols-3 mb-6">
        <div th:each="card : ${balanceCards}" class="bg-white border rounded p-4">
            <div class="text-xs text-gray-500" th:text="${card.section.label}">공용</div>
            <div class="text-2xl font-bold mt-1"
                 th:text="${#numbers.formatInteger(card.currentBalance, 3, 'COMMA') + '원'}">0원</div>
            <div class="text-xs mt-2"
                 th:classappend="${card.monthChange >= 0} ? 'text-blue-700' : 'text-red-700'"
                 th:text="'이번 달: ' + ${(card.monthChange >= 0 ? '+' : '') + #numbers.formatInteger(card.monthChange, 3, 'COMMA') + '원'}">
                이번 달: +0원
            </div>
        </div>
    </section>

    <section class="bg-white border rounded p-4 mb-6">
        <h2 class="text-lg font-semibold mb-3">이번 달 요약</h2>
        <div class="grid grid-cols-3 gap-3 text-center">
            <div>
                <div class="text-xs text-gray-500">총 수입</div>
                <div class="text-lg font-semibold text-blue-700"
                     th:text="${#numbers.formatInteger(monthSummary.totalIncome, 3, 'COMMA') + '원'}">0원</div>
            </div>
            <div>
                <div class="text-xs text-gray-500">총 지출</div>
                <div class="text-lg font-semibold text-red-700"
                     th:text="${#numbers.formatInteger(monthSummary.totalExpense, 3, 'COMMA') + '원'}">0원</div>
            </div>
            <div>
                <div class="text-xs text-gray-500">순</div>
                <div class="text-lg font-semibold"
                     th:classappend="${monthSummary.net >= 0} ? 'text-blue-700' : 'text-red-700'"
                     th:text="${(monthSummary.net >= 0 ? '+' : '') + #numbers.formatInteger(monthSummary.net, 3, 'COMMA') + '원'}">
                    +0원
                </div>
            </div>
        </div>
    </section>

    <section class="bg-white border rounded">
        <header class="px-4 py-2 border-b bg-gray-50 flex items-center justify-between">
            <h2 class="font-semibold text-sm">최근 거래</h2>
            <a href="/transactions" class="text-xs text-blue-600 hover:underline">전체 보기</a>
        </header>
        <div class="p-4">
            <p th:if="${#lists.isEmpty(recentTransactions)}" class="text-sm text-gray-500">아직 거래가 없어요.</p>
            <div th:unless="${#lists.isEmpty(recentTransactions)}" class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="text-gray-600">
                    <tr>
                        <th class="text-left px-2 py-1.5">일시</th>
                        <th class="text-left px-2 py-1.5">섹션</th>
                        <th class="text-left px-2 py-1.5">종류</th>
                        <th class="text-right px-2 py-1.5">금액</th>
                        <th class="text-left px-2 py-1.5">메모</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y">
                    <tr th:each="t : ${recentTransactions}">
                        <td class="px-2 py-1.5 text-xs text-gray-600"
                            th:text="${#temporals.format(t.occurredAt, 'yyyy-MM-dd HH:mm')}">2026-05-23 12:00</td>
                        <td class="px-2 py-1.5" th:text="${t.section.label}">공용</td>
                        <td class="px-2 py-1.5"
                            th:classappend="${t.type.name == 'INCOME'} ? 'text-blue-700' : 'text-red-700'"
                            th:text="${t.type.label}">지출</td>
                        <td class="px-2 py-1.5 text-right font-medium"
                            th:text="${#numbers.formatInteger(t.amount, 3, 'COMMA') + '원'}">0원</td>
                        <td class="px-2 py-1.5 text-gray-700" th:text="${t.memo}">메모</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</div>
</body>
</html>
