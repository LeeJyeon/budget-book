spring:
  application:
    name: budget-book
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    session:
      timeout: 14d

logging:
  level:
    org.springframework.security: INFO
    com.budget: DEBUG

app:
  timezone: Asia/Seoul
  whitelist: []          # prod profile에서 채움
